<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e0e0e">
<title>ClaudeVPN</title>
<style>
:root{color-scheme:dark;--page:#050505;--card:#0f0f0f;--panel:#171717;--text:#f2f2f2;--muted:#8d8d8d;--line:#2a2a2a;--ring:#3a3a3a;--ring-hi:#555;--grey:#7c7c7c;--orange:#ff6a1f;--on-bg:#2a1a10;--on-line:#6e3519;--dot:#bdbdbd}
:root[data-theme=light]{color-scheme:light;--page:#e9e7e4;--card:#f6f5f3;--panel:#fff;--text:#1d1d1d;--muted:#777;--line:#dedbd7;--ring:#d3d0cc;--ring-hi:#bdb9b4;--grey:#9a9a9a;--on-bg:#fff0e6;--on-line:#f0b28c;--dot:#888}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--page);color:var(--text);font-family:Inter,Roboto,"Segoe UI",Arial,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:16px}
.app{width:100%;max-width:430px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:22px 18px 22px;display:flex;flex-direction:column;gap:18px;overflow:hidden}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.brand{display:flex;align-items:center;gap:12px;font-size:22px;font-weight:650;letter-spacing:-.5px}
.brand svg{width:46px;height:46px;overflow:visible;margin-left:-3px}
.brand path{fill:var(--ray);transition:fill .6s}
.gear{width:40px;height:40px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:12px}
.gear svg{width:25px;height:25px;transition:transform .5s}.gear:hover svg{transform:rotate(60deg)}
.gear:focus-visible,.premium:focus-visible,.power:focus-visible{outline:2px solid var(--orange);outline-offset:4px}

/* stage */
.stage{display:grid;place-items:center;height:318px;position:relative;margin-top:2px}
.stage>*{grid-area:1/1;place-self:center;border-radius:50%}
.orbit{width:var(--d);height:var(--d);animation:turn var(--t) linear infinite var(--dir,normal);pointer-events:none}
.orbit i{position:absolute;left:var(--x);top:var(--y);width:var(--s,5px);height:var(--s,5px);margin:-2.5px;border-radius:50%;background:var(--dot);box-shadow:0 0 7px var(--dot);transition:background .6s,box-shadow .6s}
.orbit.o1{--d:318px;--t:38s}.orbit.o2{--d:296px;--t:26s;--dir:reverse}.orbit.o3{--d:262px;--t:19s}
.s-on .orbit i,.s-connecting .orbit i{background:#ffb27d;box-shadow:0 0 9px 1px var(--orange)}
.s-connecting .orbit.o1{--t:9s}.s-connecting .orbit.o2{--t:6s}.s-connecting .orbit.o3{--t:4.5s}
.ring-thin{width:318px;height:318px;border:1px solid var(--ring);transition:border-color .6s}
.ring-mid{width:262px;height:262px;border:1px solid transparent;transition:border-color .6s,box-shadow .6s}
.ring-main{width:240px;height:240px;border:8px solid var(--ring);box-shadow:inset 0 0 18px #0009;transition:border-color .6s,box-shadow .6s}
:root[data-theme=light] .ring-main{box-shadow:inset 0 0 12px #0001}
.s-on .ring-thin{border-color:#ff6a1f55}
.s-on .ring-mid{border-color:#ff6a1f40;box-shadow:0 0 26px #ff6a1f30}
.s-on .ring-main{border-color:var(--orange);box-shadow:0 0 14px 2px #ff6a1f88,0 0 60px 6px #ff6a1f44,inset 0 0 24px #ff6a1f66;animation:breathe 3.4s ease-in-out 1s infinite alternate}
.s-connecting .ring-main{border-color:#8a4318;box-shadow:0 0 18px #ff6a1f33,inset 0 0 18px #ff6a1f22}
.s-connecting .ring-thin{border-color:#ff6a1f44}

/* connecting: progress arc + glowing head + inflowing particles */
@property --p{syntax:'<number>';inherits:false;initial-value:0}
.sweep{width:240px;height:240px;opacity:0;transition:opacity .3s;pointer-events:none;
 background:conic-gradient(from 0deg,#ff6a1f00 0deg,var(--orange) calc(var(--p)*1deg),transparent calc(var(--p)*1deg));
 -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));mask:radial-gradient(farthest-side,transparent calc(100% - 8px),#000 calc(100% - 7px));
 filter:drop-shadow(0 0 8px #ff6a1f) drop-shadow(0 0 18px #ff6a1f88)}
.s-connecting .sweep{opacity:1;animation:fill 2.9s cubic-bezier(.55,.1,.3,1) forwards}
.head{width:240px;height:240px;opacity:0;pointer-events:none}
.head:after{content:"";position:absolute;left:50%;top:0;width:14px;height:14px;margin:-3px 0 0 -7px;border-radius:50%;background:#fff3e8;box-shadow:0 0 14px 5px var(--orange),0 0 34px 10px #ff6a1f88}
.s-connecting .head{opacity:1;animation:turn1 2.9s cubic-bezier(.55,.1,.3,1) forwards}
.stream{width:5px;height:5px;background:#ffc39a;box-shadow:0 0 9px 2px var(--orange);opacity:0;pointer-events:none}
.s-connecting .stream{animation:inflow 1.3s ease-in infinite var(--d)}
@keyframes fill{from{--p:0}to{--p:360}}
@keyframes turn1{from{transform:rotate(0)}to{transform:rotate(360deg)}}
@keyframes inflow{0%{transform:rotate(var(--a)) translateY(-165px) scale(1);opacity:0}20%{opacity:1}100%{transform:rotate(var(--a)) translateY(-45px) scale(.3);opacity:0}}
.pulse{width:240px;height:240px;border:2px solid var(--orange);opacity:0;pointer-events:none}
.s-connecting .pulse{animation:radar 1.9s ease-out infinite}
.s-connecting .pulse.p2{animation-delay:.95s}

/* connected: shockwave */
.shock{width:240px;height:240px;border:3px solid var(--orange);opacity:0;pointer-events:none}
.flash{width:300px;height:300px;opacity:0;pointer-events:none;background:radial-gradient(circle,#ff6a1fcc 0%,#ff6a1f44 38%,transparent 68%)}
.burst .shock{animation:shock 1s cubic-bezier(.15,.7,.3,1) forwards}
.burst .shock.k2{animation-delay:.16s;border-width:1.5px}
.burst .flash{animation:flash .9s ease-out forwards}

/* power button */
.power{position:relative;z-index:2;width:156px;height:156px;padding:6px;border:0;background:transparent;border-radius:50%;cursor:pointer;display:grid;place-items:center;--ray:var(--grey);transition:transform .2s}
.power:active{transform:scale(.95)}
.power svg{width:100%;height:100%;overflow:visible;transition:filter .6s}
.mark path{fill:var(--ray);stroke:var(--ray);stroke-width:0;stroke-linejoin:round;transition:fill .5s}
.s-on .power,.s-connecting .power,.s-on .brand,.s-connecting .brand{--ray:var(--orange)}
.s-on .brand{--ray:var(--orange)}
.brand{--ray:var(--grey)}
.s-on .power svg{filter:drop-shadow(0 0 10px #ff6a1faa)}
.s-connecting .mark path{animation:wave 1.1s ease-in-out infinite}
.burst .mark path{animation:ignite .8s ease-out both}

/* texts */
.hero{text-align:center;margin-top:-4px}
.title{font-size:26px;line-height:1.2;font-weight:500;letter-spacing:-.4px;transition:color .5s;min-height:31px}
.subtitle{font-size:15.5px;color:var(--muted);margin-top:6px;min-height:20px}
.swap{animation:swap .45s ease-out}
.dots span{animation:blink 1.2s infinite both}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
.s-on .title{color:var(--orange)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:18px 4px 16px;transition:background .6s,border-color .6s}
.stat{text-align:center;padding:0 4px}
.stat svg{width:27px;height:27px;color:var(--muted);margin-bottom:9px;transition:color .6s}
.stat-value{font-size:18.5px;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat-label{font-size:13.5px;color:var(--muted);margin-top:5px}
.s-on .stats{background:var(--on-bg);border-color:var(--on-line)}
.s-on .stat svg{color:var(--orange)}
.burst .stats{animation:glowpop 1.1s ease-out}

/* servers */
h2{font-size:17px;font-weight:500;margin:4px 0 11px 2px;letter-spacing:-.1px}
.servers{display:flex;flex-direction:column;gap:7px}
.server{display:flex;align-items:center;gap:14px;padding:0 16px 0 14px;height:70px;background:var(--panel);border:1px solid var(--line);border-radius:17px;cursor:pointer;position:relative;transition:border-color .25s,background .25s,opacity .3s}
.server input{position:absolute;opacity:0;pointer-events:none}
.flag{width:42px;height:29px;flex:none;border-radius:4px;overflow:hidden;box-shadow:0 0 0 1px #0004;display:block}
.flag svg{display:block;width:100%;height:100%}
.copy{flex:1;min-width:0}.name{font-size:16px;font-weight:500;line-height:1.2}.city{font-size:13.5px;color:var(--muted);margin-top:2px}
.ping{font-size:14px;color:var(--muted);white-space:nowrap;margin-right:4px}
.radio{width:30px;height:30px;border:2px solid var(--ring-hi);border-radius:50%;display:grid;place-items:center;flex:none;transition:border-color .25s}
.radio:after{content:"";width:16px;height:16px;border-radius:50%;background:var(--orange);transform:scale(0);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.server input:checked~.radio{border-color:var(--orange)}.server input:checked~.radio:after{transform:scale(1)}
.server input:focus-visible~.radio{outline:2px solid var(--orange);outline-offset:3px}
.s-on .server:has(input:checked){border-color:var(--on-line);background:var(--on-bg)}
.s-connecting .server:not(:has(input:checked)){opacity:.5}
.server:has(input:disabled){cursor:default}

/* premium */
.premium{width:100%;display:flex;align-items:center;gap:15px;height:68px;padding:0 20px 0 18px;border:1px solid var(--line);border-radius:18px;background:var(--panel);color:var(--muted);font:inherit;text-align:left;cursor:pointer;margin-top:3px;transition:all .6s}
.crown{width:32px;height:32px;flex:none}
.premium-label{flex:1;font-size:17px}
.arrow{width:22px;height:22px;flex:none}
.s-on .premium{border-color:var(--orange);background:var(--on-bg);color:var(--text);box-shadow:0 0 16px #ff6a1f22}
.s-on .premium .crown,.s-on .premium .arrow{color:var(--orange)}
.note{text-align:center;color:var(--muted);font-size:10px;line-height:1.5;margin:0 10px;opacity:.7}


/* server picker + sheet */
.pick{width:100%;font:inherit;color:inherit;text-align:left}
.pick .copy{pointer-events:none}
.chev{width:22px;height:22px;flex:none;color:var(--muted);margin-left:2px;transition:transform .3s,color .3s}
.pick:active{transform:scale(.985)}
.pick:focus-visible{outline:2px solid var(--orange);outline-offset:3px}
.s-on .pick{border-color:var(--on-line);background:var(--on-bg)}
.s-on .pick .chev,.s-connecting .pick .chev{opacity:.35}
.s-on .pick,.s-connecting .pick{cursor:default}
.flag.auto{display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#ff8a3d,#ff5a14);box-shadow:0 0 12px #ff6a1f55}
.flag.auto svg{width:17px;height:17px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;visibility:hidden;transition:visibility 0s .38s}
.sheet.open{visibility:visible;transition:none}
.backdrop{position:absolute;inset:0;background:#000b;opacity:0;transition:opacity .3s;-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px)}
.sheet.open .backdrop{opacity:1}
.panel{position:relative;width:100%;max-width:430px;max-height:90dvh;overflow:auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:10px 14px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.85,.25,1);box-shadow:0 -20px 60px #0008}
.sheet.open .panel{transform:none}
.grab{width:44px;height:5px;border-radius:3px;background:var(--ring-hi);margin:0 auto 14px;opacity:.7}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 14px}
.sheet-head h3{margin:0;font-size:20px;font-weight:600;letter-spacing:-.3px}
.close{width:38px;height:38px;border:0;border-radius:50%;background:var(--panel);color:var(--muted);display:grid;place-items:center;cursor:pointer}
.close svg{width:18px;height:18px}
.sheet .server{opacity:0;transform:translateY(14px)}
.sheet.open .server{opacity:1;transform:none;transition:opacity .35s calc(.08s + var(--n)*.05s),transform .4s cubic-bezier(.2,.9,.3,1) calc(.08s + var(--n)*.05s),border-color .25s,background .25s}
.sheet .server:has(input:checked){border-color:var(--orange);background:var(--on-bg)}

@keyframes turn{to{transform:rotate(360deg)}}
@keyframes radar{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.34);opacity:0}}
@keyframes shock{0%{transform:scale(.9);opacity:.95}100%{transform:scale(1.55);opacity:0}}
@keyframes flash{0%{transform:scale(.5);opacity:.9}100%{transform:scale(1.35);opacity:0}}
@keyframes wave{0%,100%{opacity:.45}50%{opacity:1}}
@keyframes ignite{0%{stroke-width:0}35%{stroke-width:4;fill:#fff1e6;stroke:#fff1e6}100%{stroke-width:0}}
@keyframes breathe{from{box-shadow:0 0 14px 2px #ff6a1f88,0 0 60px 6px #ff6a1f44,inset 0 0 24px #ff6a1f66}to{box-shadow:0 0 22px 4px #ff6a1fb0,0 0 80px 12px #ff6a1f55,inset 0 0 30px #ff6a1f88}}
@keyframes swap{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}
@keyframes glowpop{0%{box-shadow:0 0 0 0 #ff6a1f00}30%{box-shadow:0 0 30px 2px #ff6a1f66}100%{box-shadow:0 0 0 0 #ff6a1f00}}

@media(max-width:480px){
 body{padding:0;display:block}
 .app{max-width:none;min-height:100dvh;border:0;border-radius:0;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(22px + env(safe-area-inset-bottom,0px))}
}
@media(max-width:360px){
 .stage{transform:scale(.88);margin:-18px 0}
 .title{font-size:23px}.stat-value{font-size:16px}.name{font-size:15px}
}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app s-off" id="app">
<header>
 <div class="brand"><svg viewBox="0 0 100 100" aria-hidden="true" class="mark-gen"></svg>ClaudeVPN</div>
 <button class="gear" id="theme" aria-label="Сменить тему">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
 </button>
</header>

<section class="hero">
 <div class="stage">
  <div class="orbit o1"><i style="--x:50%;--y:0"></i><i style="--x:93%;--y:25%;--s:3px"></i></div>
  <div class="orbit o2"><i style="--x:100%;--y:50%;--s:3px"></i><i style="--x:12%;--y:84%;--s:4px"></i></div>
  <div class="orbit o3"><i style="--x:50%;--y:100%;--s:3px"></i><i style="--x:6%;--y:30%;--s:4px"></i></div>
  <div class="ring-thin"></div>
  <div class="ring-mid"></div>
  <div class="flash"></div>
  <div class="pulse p1"></div><div class="pulse p2"></div>
  <div class="ring-main"></div>
  <div class="sweep"></div><div class="head"></div>
  <div class="shock"></div><div class="shock k2"></div>
  <button class="power" id="power" aria-label="Подключиться" aria-pressed="false">
   <svg class="mark mark-gen" viewBox="0 0 100 100" aria-hidden="true"></svg>
  </button>
 </div>
 <div class="title" id="title">Не подключено</div>
 <div class="subtitle" id="subtitle">Ваше соединение не защищено</div>
</section>

<section class="stats">
 <div class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 20h16"/></svg><div class="stat-value" id="down">0 B</div><div class="stat-label">Скачано</div></div>
 <div class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3m-5 5 5-5 5 5M4 20h16"/></svg><div class="stat-value" id="up">0 B</div><div class="stat-label">Загружено</div></div>
 <div class="stat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><div class="stat-value" id="time">00:00:00</div><div class="stat-label">Время</div></div>
</section>

<section>
 <h2>Выбор сервера</h2>
 <button class="server pick" id="pick" aria-haspopup="dialog" aria-expanded="false">
  <span class="flag auto" id="pickFlag"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 2 5 13.4h5.3L9.4 22 18.6 10h-5.6z"/></svg></span>
  <span class="copy"><span class="name" id="pickName">Автоматически</span><br><span class="city" id="pickCity">Автовыбор из подписки</span></span><span class="ping" id="pickPing">Авто</span><svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
 </button>
</section>

<button class="premium" id="premium">
 <svg class="crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8l4.5 4.2L12 5l4.5 7.2L21 8l-1.8 10H4.8z"/><path d="M5 21h14"/></svg>
 <span class="premium-label">Настроить подписку</span>
 <svg class="arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
</button>
<p class="note" id="appNote">Добавьте ссылку подписки, затем нажмите центральную кнопку для подключения.</p>
</main>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Выбор сервера">
 <div class="backdrop" id="backdrop"></div>
 <div class="panel">
  <div class="grab"></div>
  <div class="sheet-head"><h3>Выбор сервера</h3><button class="close" id="close" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="servers" id="list"><label class="server"><input type="radio" name="server" value="Авто" checked>
   <span class="flag auto"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13.2 2 5 13.4h5.3L9.4 22 18.6 10h-5.6z"/></svg></span>
   <span class="copy"><span class="name">Автоматически</span><br><span class="city">Автовыбор из подписки</span></span><span class="ping">Авто</span><span class="radio"></span></label></div>
 </div>
</div>

<script>

const fmt=v=>v<10?v.toFixed(1)+' MB':Math.round(v)+' MB';
const later=(f,ms)=>timers.push(setTimeout(f,ms));
const clearAll=()=>{timers.forEach(clearTimeout);timers=[]};

function say(t,sub,dots){
 title.innerHTML=dots?t+'<span class="dots"><span>.</span><span>.</span><span>.</span></span>':t;
 if(sub!==undefined)subtitle.textContent=sub;
 [title,subtitle].forEach(e=>{e.classList.remove('swap');void e.offsetWidth;e.classList.add('swap')});
}
function render(){app.className='app s-'+state+(burst?' burst':'')}
function setState(s){
 state=s;render();
 radios.forEach(r=>r.disabled=s!=='off');
 power.setAttribute('aria-pressed',String(s==='on'));
 if(s==='off'){say('Не подключено','Ваше соединение не защищено');power.setAttribute('aria-label','Подключиться');time.textContent='00:00:00';down.textContent=up.textContent='0 B'}
 if(s==='connecting'){say('Подключение','Поиск сервера…',true);power.setAttribute('aria-label','Отменить подключение')}
 if(s==='on'){say('Подключено','Ваше соединение защищено');power.setAttribute('aria-label','Отключиться')}
}

function connect(){
  if(!window.VpnBridge){say('Недоступно','Откройте приложение ClaudeVPN');return}
  setState('connecting');
  window.VpnBridge.postMessage(JSON.stringify({action:'connect'}));
}
function disconnect(){
  if(window.VpnBridge) window.VpnBridge.postMessage(JSON.stringify({action:'disconnect'}));
}
function applyNativeState(detail){
  clearAll();
  if(detail.state==='connecting'){setState('connecting');}
  else if(detail.state==='connected'){burst=true;setState('on');later(()=>{burst=false;render()},1400);}
  else if(detail.state==='disconnected'){setState('off');}
  else if(detail.state==='error'){
    setState('off');
    say('Ошибка подключения',detail.message||'Проверьте ссылку подписки и интернет');
  }
}
window.addEventListener('vpnstate',e=>applyNativeState(e.detail||{}));
window.addEventListener('vpnstats',e=>{
  const s=e.detail||{};
  down.textContent=s.download||'0 B';
  up.textContent=s.upload||'0 B';
  time.textContent=s.time||'00:00:00';
});
/* выбор сервера: карточка + окно */

document.querySelectorAll('#list .server').forEach((e,i)=>e.style.setProperty('--n',i));
const openSheet=()=>{
 if(state!=='off'){pick.classList.remove('shake');void pick.offsetWidth;pick.classList.add('shake');return}
 sheet.classList.add('open');pick.setAttribute('aria-expanded','true');
};
const closeSheet=()=>{sheet.classList.remove('open');pick.setAttribute('aria-expanded','false');pick.focus({preventScroll:true})};
pick.addEventListener('click',openSheet);
$('close').addEventListener('click',closeSheet);
$('backdrop').addEventListener('click',closeSheet);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheet.classList.contains('open'))closeSheet()});
radios.forEach(r=>r.addEventListener('change',()=>{
 const l=r.closest('.server');
 $('pickFlag').className=l.querySelector('.flag').className;
 $('pickFlag').innerHTML=l.querySelector('.flag').innerHTML;
 $('pickName').textContent=l.querySelector('.name').textContent;
 $('pickCity').textContent=l.querySelector('.city').textContent;
 $('pickPing').textContent=l.querySelector('.ping').textContent;
 setTimeout(closeSheet,260);
}));

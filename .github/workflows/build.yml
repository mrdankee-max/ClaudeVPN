name: Build ClaudeVPN APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '*.zip'
      - 'app_src/**'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Locate project sources
        run: |
          if [ -d app_src ]; then
            echo "Using app_src folder from repo"
            echo "SRC=app_src" >> "$GITHUB_ENV"
          else
            ZIP=$(ls -1 *.zip | head -n 1)
            echo "Using $ZIP"
            mkdir project
            unzip -q "$ZIP" -d project
            SRC=$(dirname "$(find project -type d -name app_src | head -n 1)")/app_src
            test -d "$SRC" || { echo "app_src not found"; exit 1; }
            echo "SRC=$SRC" >> "$GITHUB_ENV"
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.zephyy --project-name claudevpn build_app
          cp -R "$SRC"/. build_app/

      - name: Apply app icon and name
        run: |
          if [ -d "$SRC/android_res" ]; then cp -R "$SRC"/android_res/. build_app/android/app/src/main/res/; fi
          sed -i 's/android:label="[^"]*"/android:label="ClaudeVPN"/' build_app/android/app/src/main/AndroidManifest.xml

      - name: Set Android minimum SDK
        working-directory: build_app
        run: sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' android/app/build.gradle.kts

      - name: Get dependencies
        working-directory: build_app
        run: flutter pub get

      - name: Build APK
        working-directory: build_app
        run: flutter build apk --release --target-platform android-arm64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeVPN-APK
          path: build_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14